<!DOCTYPE html>
<html>
<head>
    <title>Contact - ByteBites Café & Bakery</title>
</head>

<body bgcolor="#FFF5E6">

<center>

<h1><font color="#8B4513">Contact Us</font></h1>

<p>
    Have a question or want to place an order?
    Fill out the form below.
</p>

<form>

<table cellpadding="8">

<tr>
    <td><b>Full Name:</b></td>
    <td>
        <input type="text" name="fullname">
    </td>
</tr>

<tr>
    <td><b>Email:</b></td>
    <td>
        <input type="email" name="email">
    </td>
</tr>

<tr>
    <td><b>Phone:</b></td>
    <td>
        <input type="text" name="phone">
    </td>
</tr>

<tr>
    <td><b>Product:</b></td>
    <td>
        <select name="product">
            <option>Classic Coffee</option>
            <option>Chocolate Cake</option>
            <option>Cheese Bread</option>
            <option>Iced Latte</option>
            <option>Cookies</option>
        </select>
    </td>
</tr>

<tr>
    <td><b>Quantity:</b></td>
    <td>
        <input type="number" name="quantity">
    </td>
</tr>

<tr>
    <td><b>Message:</b></td>
    <td>
        <textarea name="message" rows="5" cols="30"></textarea>
    </td>
</tr>

<tr>
    <td></td>
    <td>
        <input type="submit" value="Submit Order">
        <input type="reset" value="Clear">
    </td>
</tr>

</table>

</form>

<hr>

<h3>Visit Us</h3>

<p>
    123 Main Street, Quezon City, Philippines
</p>

<p>
    Email:
    <a href="mailto:rookiescafe@email.com">
        rookiescafe@email.com
    </a>
</p>

</center>

</body>
</html>
